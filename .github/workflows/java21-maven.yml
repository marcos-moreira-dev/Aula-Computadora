name: Java 21 · NAND2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/java21-maven.yml'
      - 'simulador-javafx/**'
      - 'scripts/verificar_primer_taller_java.sh'
  pull_request:
    paths:
      - '.github/workflows/java21-maven.yml'
      - 'simulador-javafx/**'
      - 'scripts/verificar_primer_taller_java.sh'

permissions:
  contents: read

jobs:
  nand2:
    name: Compilación y pruebas del modelo
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simulador-javafx/pom.xml
      - name: Compilar y ejecutar JUnit
        run: mvn -B -ntp -f simulador-javafx/pom.xml clean test
      - name: Verificar lógica sin interfaz
        run: bash scripts/verificar_primer_taller_java.sh
