<text x="75" y="76" class="title">AULA-16 · dos bancos de RAM de 8 bits, palabra de 16 bits</text>
<text x="75" y="115" class="sub">Arquitectura candidata: dirección de 16 bits, memoria direccionada por bytes, little-endian y palabra alineada.</text>
