<text x="112" y="887" class="block">Ejemplo de memoria little-endian</text>
<text x="112" y="930" class="tiny">Palabra 0x1234 en dirección par 0x6000:</text>
<text x="112" y="974" class="tiny">RAM[0x6000] = 0x34 (byte bajo) · RAM[0x6001] = 0x12 (byte alto)</text>
<text x="112" y="1026" class="tiny">Espacio: 2¹⁶ direcciones × 1 byte = 65.536 bytes (64 KiB). Palabras alineadas: 32.768.</text>
<text x="86" y="1138" class="sub">Nota: esquema de organización arquitectónica, no una RAM física construida ni una ISA definitiva.</text>
