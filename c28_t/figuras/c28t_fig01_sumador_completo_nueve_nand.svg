<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Sumador completo de nueve NAND con conexiones etiquetadas</title>
<desc id="descripcion">Red digital de un sumador completo. N1 produce t, N2 y N3 producen u y v, N4 da P. N5 a N8 producen S y N9 combina t y w para Cout. Las etiquetas de señales representan conexiones lógicas entre paneles, no cableado físico.</desc>
<defs>
  <style>
    text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#173046}
    .titulo{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#4d6577}
    .panel{fill:#f6f9fc;stroke:#c8d6e3;stroke-width:2.5}
    .gate{fill:#fff;stroke:#41647f;stroke-width:2.5}
    .branch{fill:#e5f3fa;stroke:#1a7ba8;stroke-width:2.5}
    .out{fill:#e1f4e9;stroke:#2f8c61;stroke-width:2.5}
    .name{font-size:22px;font-weight:700}.eq{font-size:17px;fill:#344d61}
    .net{font-size:18px;font-weight:700;fill:#08688d}.badge{fill:#ebf6fc;stroke:#75adc7;stroke-width:1.5}
    .line{stroke:#316a89;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dot{fill:#316a89}.tiny{font-size:16px;fill:#4e6475}
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#316a89"/></marker>
</defs>
<rect width="1400" height="1080" fill="#fbfdff"/>
<text x="55" y="66" class="titulo">Del sumador completo a nueve puertas NAND</text>
<text x="56" y="99" class="sub">La entrada de cada NAND se escribe explícitamente. Coincidencia de nombre de señal = misma red lógica.</text>

<rect x="43" y="130" width="1314" height="316" rx="20" class="panel"/>
<text x="67" y="164" class="name">1. Obtener P = A XOR B con cuatro NAND</text>
<rect x="114" y="227" width="258" height="100" rx="15" class="branch"/>
<text x="138" y="264" class="name">N1: NAND(A, B)</text><text x="138" y="295" class="eq">t = ¬(A · B)</text>
<rect x="503" y="191" width="260" height="94" rx="15" class="gate"/>
<text x="526" y="225" class="name">N2: NAND(A, t)</text><text x="526" y="257" class="eq">u = ¬(A · t)</text>
<rect x="503" y="326" width="260" height="94" rx="15" class="gate"/>
<text x="526" y="360" class="name">N3: NAND(B, t)</text><text x="526" y="392" class="eq">v = ¬(B · t)</text>
<rect x="901" y="258" width="279" height="100" rx="15" class="out"/>
<text x="925" y="296" class="name">N4: NAND(u, v)</text><text x="925" y="328" class="eq">P = A XOR B</text>
<path class="line" d="M372 277 H434 V238 H503"/><path class="line" d="M434 277 V373 H503"/>
<path class="line" d="M763 238 H834 V286 H901"/><path class="line" d="M763 373 H835 V329 H901"/>
<circle cx="434" cy="277" r="6" class="dot"/>
<text x="379" y="263" class="net">t</text><text x="827" y="269" class="net">u</text><text x="827" y="349" class="net">v</text>
<rect x="1201" y="282" width="119" height="51" rx="12" class="badge"/>
<text x="1231" y="316" class="name">P</text><path class="line" d="M1180 307 H1200"/>

<rect x="43" y="478" width="1314" height="316" rx="20" class="panel"/>
<text x="67" y="511" class="name">2. Incorporar el acarreo Cin con otras cuatro NAND</text>
<rect x="114" y="575" width="258" height="102" rx="15" class="branch"/>
<text x="138" y="614" class="name">N5: NAND(P, Cin)</text><text x="138" y="647" class="eq">w = ¬(P · Cin)</text>
<rect x="503" y="540" width="260" height="94" rx="15" class="gate"/>
<text x="526" y="574" class="name">N6: NAND(P, w)</text><text x="526" y="604" class="eq">x = ¬(P · w)</text>
<rect x="503" y="677" width="260" height="94" rx="15" class="gate"/>
<text x="526" y="711" class="name">N7: NAND(Cin, w)</text><text x="526" y="744" class="eq">y = ¬(Cin · w)</text>
<rect x="901" y="609" width="279" height="100" rx="15" class="out"/>
<text x="925" y="646" class="name">N8: NAND(x, y)</text><text x="925" y="679" class="eq">S = A XOR B XOR Cin</text>
<path class="line" d="M372 626 H434 V587 H503"/><path class="line" d="M434 626 V724 H503"/>
<path class="line" d="M763 587 H834 V638 H901"/><path class="line" d="M763 724 H835 V680 H901"/>
<circle cx="434" cy="626" r="6" class="dot"/>
<text x="380" y="610" class="net">w</text><text x="827" y="622" class="net">x</text><text x="827" y="703" class="net">y</text>
<rect x="1201" y="633" width="119" height="51" rx="12" class="badge"/>
<text x="1231" y="667" class="name">S</text><path class="line" d="M1180 658 H1200"/>

<rect x="43" y="831" width="1314" height="202" rx="20" class="panel"/>
<text x="67" y="870" class="name">3. Unir los dos acarreos parciales en la novena NAND</text>
<rect x="157" y="906" width="250" height="83" rx="14" class="badge"/>
<text x="178" y="939" class="eq">t viene de N1</text><text x="178" y="966" class="eq">w viene de N5</text>
<rect x="504" y="899" width="385" height="94" rx="15" class="out"/>
<text x="531" y="936" class="name">N9: NAND(t, w)</text><text x="531" y="970" class="eq">Cout = (A·B) OR (P·Cin)</text>
<path class="line" d="M407 948 H504"/>
<rect x="1040" y="915" width="225" height="60" rx="13" class="badge"/>
<text x="1060" y="953" class="name">Cout</text><path class="line" d="M889 947 H1040"/>
<text x="48" y="1060" class="tiny">NAND ideal de dos entradas · sin temporización, pines físicos, capacitancias o tensiones · correspondencia con C28-R.</text>
</svg>
