<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><title>Imagen dividida en unidades exactas de 256 bytes</title><rect width="1000" height="500" fill="white"/>
<style>
  text {font-family: 'DejaVu Sans', Arial, sans-serif; fill:#1b2a38}
  .wire {stroke:#273746;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .node {fill:#273746}
  .block {fill:#f0f6fb;stroke:#273746;stroke-width:3}
  .label {font-size:22px;font-weight:bold}
  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style><text x="35" y="43" class="label">Imagen dividida en unidades exactas de 256 bytes</text><text x="35" y="76" class="small">Los offsets se calculan como número de bloque × 256.</text><rect x="23" y="164" width="220" height="174" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="133.0" y="212" class="label" text-anchor="middle">BLOQUE 0000</text><text x="133.0" y="258" class="small" text-anchor="middle">Offset 0000</text><text x="133" y="314" class="tiny" text-anchor="middle">0000–00FF</text><path d="M243,257 L267,257" fill="none" stroke="#244d68" stroke-width="4"/><path d="M267,257 L250.0,266.0 L250.0,248.0 Z" fill="#244d68"/><rect x="267" y="164" width="220" height="174" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="377.0" y="212" class="label" text-anchor="middle">BLOQUE 0001</text><text x="377.0" y="258" class="small" text-anchor="middle">Offset 0100</text><text x="377" y="314" class="tiny" text-anchor="middle">0100–01FF</text><path d="M487,257 L511,257" fill="none" stroke="#244d68" stroke-width="4"/><path d="M511,257 L494.0,266.0 L494.0,248.0 Z" fill="#244d68"/><rect x="511" y="164" width="220" height="174" rx="14" fill="#e6f4e7" stroke="#36556b" stroke-width="2.5"/><text x="621.0" y="212" class="label" text-anchor="middle">BLOQUE 0002</text><text x="621.0" y="258" class="small" text-anchor="middle">Offset 0200</text><text x="621" y="314" class="tiny" text-anchor="middle">0200–02FF</text><path d="M731,257 L755,257" fill="none" stroke="#244d68" stroke-width="4"/><path d="M755,257 L738.0,266.0 L738.0,248.0 Z" fill="#244d68"/><rect x="755" y="164" width="220" height="174" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="865.0" y="212" class="label" text-anchor="middle">BLOQUE 0003</text><text x="865.0" y="258" class="small" text-anchor="middle">Offset 0300</text><text x="865" y="314" class="tiny" text-anchor="middle">0300–03FF</text><text x="500" y="393" class="small" text-anchor="middle">BLOQUE 0002 = bytes 0200–02FF de la imagen.</text><text x="500" y="435" class="tiny" text-anchor="middle">El número de bloque no es el nombre de un archivo.</text></svg>