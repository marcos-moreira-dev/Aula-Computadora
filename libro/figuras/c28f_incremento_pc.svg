<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
<rect width="100%" height="100%" fill="#fdfdfb"/>
<text x="72" y="80" fill="#173b4d" font-size="41" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Incrementar el PC es una suma binaria de uno</text>
<text x="72" y="132" fill="#58727d" font-size="26" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">El acarreo se propaga entre bits; la salida no modifica FLAGS.</text>
<rect x="72" y="176" width="1616" height="302" rx="12" fill="#edf4f8"/>
<text x="110" y="219" fill="#173b4d" font-size="30" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Cadena de 16 bits: el acarreo avanza desde el bit 0</text>
<rect x="132" y="277" width="220" height="125" rx="12" fill="#dff1e8"/>
<text x="242" y="315" fill="#173b4d" font-size="29" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">bit 0</text>
<text x="242" y="358" fill="#173b4d" font-size="22" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">NOT PC0</text>
<path d="M352 337 H452" stroke="#287489" stroke-width="5"/>
<rect x="454" y="277" width="220" height="125" rx="12" fill="#dff1e8"/>
<text x="564" y="315" fill="#173b4d" font-size="29" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">bit 1</text>
<text x="564" y="358" fill="#173b4d" font-size="22" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">XOR + carry</text>
<path d="M674 337 H774" stroke="#287489" stroke-width="5"/>
<rect x="776" y="277" width="220" height="125" rx="12" fill="#dff1e8"/>
<text x="886" y="315" fill="#173b4d" font-size="29" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">bit 2</text>
<text x="886" y="358" fill="#173b4d" font-size="22" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">XOR + carry</text>
<path d="M996 337 H1096" stroke="#287489" stroke-width="5"/>
<rect x="1098" y="277" width="220" height="125" rx="12" fill="#e6edf7"/>
<text x="1208" y="315" fill="#173b4d" font-size="29" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">…</text>
<text x="1208" y="358" fill="#173b4d" font-size="22" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">propaga</text>
<path d="M1318 337 H1418" stroke="#287489" stroke-width="5"/>
<rect x="1420" y="277" width="220" height="125" rx="12" fill="#e6edf7"/>
<text x="1530" y="315" fill="#173b4d" font-size="29" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">bit 15</text>
<text x="1530" y="358" fill="#173b4d" font-size="22" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">XOR + carry</text>
<text x="108" y="449" fill="#173b4d" font-size="26" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">C1=PC0   ·   C2=PC1·C1   ·   ...   ·   INC[i]=PC[i] XOR C[i]</text>
<rect x="72" y="515" width="1616" height="446" rx="12" fill="#f4f8f5"/>
<text x="112" y="563" fill="#173b4d" font-size="28" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Un bit i&gt;0: XOR realizado con NAND, y acarreo siguiente</text>
<rect x="104" y="590" width="1532" height="55" rx="12" fill="#e7eff4"/>
<text x="142" y="625" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">T_i</text>
<text x="420" y="625" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">NAND(PC[i], C_i)</text>
<text x="1070" y="625" fill="#486577" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Negación del AND</text>
<rect x="104" y="652" width="1532" height="55" rx="12" fill="#fbfcfd"/>
<text x="142" y="687" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">U_i</text>
<text x="420" y="687" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">NAND(PC[i], T_i)</text>
<text x="1070" y="687" fill="#486577" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Rama del XOR</text>
<rect x="104" y="714" width="1532" height="55" rx="12" fill="#e7eff4"/>
<text x="142" y="749" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">V_i</text>
<text x="420" y="749" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">NAND(C_i, T_i)</text>
<text x="1070" y="749" fill="#486577" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Segunda rama del XOR</text>
<rect x="104" y="776" width="1532" height="55" rx="12" fill="#fbfcfd"/>
<text x="142" y="811" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">INC[i]</text>
<text x="420" y="811" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">NAND(U_i, V_i)</text>
<text x="1070" y="811" fill="#486577" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Bit incrementado</text>
<rect x="104" y="838" width="1532" height="55" rx="12" fill="#e7eff4"/>
<text x="142" y="873" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">C_(i+1)</text>
<text x="420" y="873" fill="#173b4d" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">NAND(T_i, T_i)</text>
<text x="1070" y="873" fill="#486577" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Acarreo para el bit siguiente</text>
<text x="108" y="945" fill="#173b4d" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Bit 0: INC0 = NOT PC0, C1 = PC0. En bit 15 ya no hace falta C16.</text>
<text x="108" y="1016" fill="#173b4d" font-size="26" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">75 NAND para PC+1; el desbordamiento FFFF→0000 se prueba sin tocar C visible.</text>
</svg>