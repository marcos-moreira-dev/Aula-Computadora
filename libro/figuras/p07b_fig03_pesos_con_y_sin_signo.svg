<text x="44" y="261" class="small">Sin signo</text>
<text x="214" y="261" class="small" text-anchor="middle">128</text><text x="308" y="261" class="small" text-anchor="middle">64</text><text x="402" y="261" class="small" text-anchor="middle">32</text><text x="496" y="261" class="small" text-anchor="middle">16</text><text x="590" y="261" class="small" text-anchor="middle">8</text><text x="684" y="261" class="small" text-anchor="middle">4</text><text x="778" y="261" class="small" text-anchor="middle">2</text><text x="872" y="261" class="small" text-anchor="middle">1</text>
