<text x="1778" y="851" fill="#153a4e" font-size="23" font-family="DejaVu Sans" font-weight="bold" text-anchor="end">D[i]</text>
<text x="120" y="1128" fill="#153a4e" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">LOAD_N = NAND(LOAD, LOAD)   ·   CLR_N = NAND(CLR_TEST, CLR_TEST)</text>
<text x="120" y="1179" fill="#153a4e" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Se repiten cinco NAND por bit: 2 compartidas + 5 × 16 = 82 NAND.</text>
<text x="120" y="1228" fill="#596f7d" font-size="23" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">No dibuja el interior de los DFF, ni RESET físico, retardos o bus externo.</text>
</svg>