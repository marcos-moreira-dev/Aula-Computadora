<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1310" viewBox="0 0 1900 1310">
<rect width="100%" height="100%" fill="#fdfdfc"/>
<text x="80" y="91" fill="#153a4e" font-size="39" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">El PC guarda una dirección; no cambia cuando cambia su entrada</text>
<text x="80" y="147" fill="#587080" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">PC16 · banco de 16 DFF de flanco ascendente · circuito candidato de laboratorio</text>
<rect x="76" y="182" width="1740" height="388" rx="15" fill="#edf4f8"/>
<text x="117" y="232" fill="#153a4e" font-size="29" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Vista de los dieciséis bits</text>
<rect x="480" y="284" width="540" height="178" rx="15" fill="#e3f0ec"/>
<text x="750" y="341" fill="#153a4e" font-size="31" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">RED COMBINACIONAL</text>
<text x="750" y="387" fill="#153a4e" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">82 NAND · LOAD / CLR_TEST</text>
<text x="750" y="430" fill="#153a4e" font-size="23" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">D = ¬CLR_TEST · MUX(LOAD, Q, NEXT)</text>
<rect x="1190" y="284" width="348" height="178" rx="15" fill="#dfe8f6"/>
<text x="1364" y="345" fill="#153a4e" font-size="35" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">16 × DFF</text>
<text x="1364" y="394" fill="#153a4e" font-size="23" font-family="DejaVu Sans" font-weight="normal" text-anchor="middle">capturan solo en CLK ↑</text>
<path d="M116 315 H470" stroke="#247d91" stroke-width="6"/>
<text x="116" y="284" fill="#153a4e" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">PC_NEXT[15:0]</text>
