nchor="middle">R0=6, R1=6</text><text x="500" y="393" class="small" text-anchor="middle">CMP decide la rama; SUB reduce el mayor de los dos enteros.</text><text x="500" y="437" class="small" text-anchor="middle">FIN: RAM[6F00] = 06  |  Precondición: ambos enteros positivos.</text></svg>