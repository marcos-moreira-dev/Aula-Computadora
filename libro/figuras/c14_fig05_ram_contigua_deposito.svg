    <text x="38" y="61" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="bold" fill="#223442" text-anchor="start">El programa ocupa una franja real de RAM</text>
    <text x="39" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#536c7a" text-anchor="start">La memoria no entiende «LDI» o «ST»: contiene bytes contiguos.</text>
