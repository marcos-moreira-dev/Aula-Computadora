"normal" fill="#223442" text-anchor="middle">Los ocho bytes del programa están en posiciones consecutivas.</text><text x="502" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#576d79" text-anchor="middle">La CPU primero lee instrucciones; ST escribe el dato 0x2A en otra dirección.</text>
