</style><text x="35" y="43" class="label">Tres formas de decir «funciona»</text><text x="35" y="76" class="small">Teoría, simulación de referencia y verificación física producen evidencias diferentes.</text><rect x="22" y="145" width="290" height="215" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="167.0" y="193" class="label" text-anchor="middle">EXPLICADO</text><text x="167.0" y="239" class="small" text-anchor="middle">bits, registros, memoria</text><rect x="356" y="145" width="290" height="215" rx="14" fill="#e9f4e6" stroke="#36556b" stroke-width="2.5"/><text x="501.0" y="193" class="label" text-anchor="middle">MODELO COMPROBADO</text><text x="501.0" y="239" class="small" text-anchor="middle">Python, diagramas, PDF</text><rect x="689" y="145" width="289" height="215" rx="14" fill="#fce8e8" stroke="#36556b" stroke-width="2.5"/><text x="833.5" y="193" class="label" text-anchor="middle">PENDIENTE</text><text x="833.5" y="239" class="small" text-anchor="middle">CPU, ROM, hardware</text><path d="M312,252 L356,252" fill="none" stroke="#244d68" stroke-width="4"/><path d="M356,252 L339.0,261.0 L339.0,243.0 Z" fill="#244d68"/><path d="M646,252 L689,252" fill="none" stroke="#244d68" stroke-width="4"/><path d="M689,252 L672.0,261.0 L672.0,243.0 Z" fill="#244d68"/><text x="500" y="452" class="small" text-anchor="middle">Un manuscrito completo no equivale a una microcomputadora construida.</text></svg>