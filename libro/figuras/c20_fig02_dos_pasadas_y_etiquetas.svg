</style><text x="35" y="43" class="label">Por qué hacen falta dos pasadas</text><text x="35" y="76" class="small">Una referencia adelantada se convierte en dos bytes de destino.</text><rect x="30" y="142" width="405" height="250" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="232.5" y="190" class="label" text-anchor="middle">PASADA 1</text><text x="232.5" y="236" class="small" text-anchor="middle">medir instrucciones</text><text x="232" y="272" class="small" text-anchor="middle">BUCLE = 6006</text><text x="232" y="311" class="small" text-anchor="middle">RESTAR_A = 6013</text><text x="232" y="350" class="small" text-anchor="middle">FIN = 6018</text><rect x="565" y="142" width="405" height="250" rx="14" fill="#e9f4e6" stroke="#36556b" stroke-width="2.5"/><text x="767.5" y="190" class="label" text-anchor="middle">PASADA 2</text><text x="767.5" y="236" class="small" text-anchor="middle">resolver etiquetas</text><text x="766" y="269" class="label" text-anchor="middle">JZ FIN  →  31 18 60</text><text x="766" y="312" class="small" text-anchor="middle">destino 6018 (bajo 18, alto 60)</text><path d="M435,264 L565,264" fill="none" stroke="#244d68" stroke-width="4"/><path d="M565,264 L548.0,273.0 L548.0,255.0 Z" fill="#244d68"/><text x="500" y="430" class="small" text-anchor="middle">Los tamaños de instrucción determinan las direcciones.</text></svg>