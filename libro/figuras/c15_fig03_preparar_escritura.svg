<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><title>Escribir no es reutilizar el último byte leído</title><rect width="1000" height="500" fill="white"/>
<style>
  text {font-family: 'DejaVu Sans', Arial, sans-serif; fill:#1b2a38}
  .wire {stroke:#273746;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .node {fill:#273746}
  .block {fill:#f0f6fb;stroke:#273746;stroke-width:3}
  .label {font-size:22px;font-weight:bold}
  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style><text x="35" y="43" class="label">Escribir no es reutilizar el último byte leído</text><text x="35" y="76" class="small">Después de leer el alto 6F, ST_STAGE_DATA prepara el 2A antes de WR.</text><rect x="31" y="150" width="292" height="247" rx="14" fill="#fae9e7" stroke="#36556b" stroke-width="2.5"/><rect x="353" y="150" width="292" height="247" rx="14" fill="#f8f0dc" stroke="#36556b" stroke-width="2.5"/><rect x="675" y="150" width="292" height="247" rx="14" fill="#e5f4e7" stroke="#36556b" stroke-width="2.5"/><text x="176" y="187" class="label" text-anchor="middle">RIESGO</text><text x="176" y="234" class="small" text-anchor="middle">MAR = 6F00</text><text x="176" y="280" class="label" text-anchor="middle">MDR = 6F</text><text x="176" y="339" class="small" text-anchor="middle">Aún no escribir</text><text x="499" y="187" class="label" text-anchor="middle">PREPARAR</text><text x="499" y="234" class="small" text-anchor="middle">R0 = 2A</text><text x="499" y="280" class="label" text-anchor="middle">MDR ← 2A</text><text x="499" y="339" class="small" text-anchor="middle">ST_STAGE_DATA</text><text x="821" y="187" class="label" text-anchor="middle">ESCRIBIR</text><text x="821" y="234" class="small" text-anchor="middle">MAR = 6F00</text><text x="821" y="280" class="label" text-anchor="middle">RAM[6F00] = 2A</text><text x="821" y="339" class="small" text-anchor="middle">WR solo si el bus es seguro</text><text x="500" y="462" class="small" text-anchor="middle">No hay un circuito ni temporización eléctrica certificados.</text></svg>