</style><text x="35" y="43" class="label">De una idea a una computadora ejecutando</text><text x="35" y="76" class="small">Cada herramienta debe existir y pasar pruebas antes de la siguiente.</text><rect x="24" y="159" width="216" height="168" rx="14" fill="#e9f4e6" stroke="#36556b" stroke-width="2.5"/><text x="132.0" y="207" class="label" text-anchor="middle">PROBLEMA</text><text x="132.0" y="253" class="small" text-anchor="middle">Sumar 3 palabras</text><path d="M240,246 L270,246" fill="none" stroke="#244d68" stroke-width="4"/><path d="M270,246 L253.0,255.0 L253.0,237.0 Z" fill="#244d68"/><rect x="270" y="159" width="216" height="168" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="378.0" y="207" class="label" text-anchor="middle">FUENTE</text><text x="378.0" y="253" class="small" text-anchor="middle">Pseudocódigo</text><path d="M486,246 L516,246" fill="none" stroke="#244d68" stroke-width="4"/><path d="M516,246 L499.0,255.0 L499.0,237.0 Z" fill="#244d68"/><rect x="516" y="159" width="216" height="168" rx="14" fill="#f9eedc" stroke="#36556b" stroke-width="2.5"/><text x="624.0" y="207" class="label" text-anchor="middle">HERRAMIENTAS</text><text x="624.0" y="253" class="small" text-anchor="middle">ISA/ABI futuras</text><path d="M732,246 L762,246" fill="none" stroke="#244d68" stroke-width="4"/><path d="M762,246 L745.0,255.0 L745.0,237.0 Z" fill="#244d68"/><rect x="762" y="159" width="216" height="168" rx="14" fill="#fce8e8" stroke="#36556b" stroke-width="2.5"/><text x="870.0" y="207" class="label" text-anchor="middle">CPU AULA-16</text><text x="870.0" y="253" class="small" text-anchor="middle">No implementada</text><text x="500" y="415" class="small" text-anchor="middle">Hoy sí podemos comprobar la referencia matemática en anfitrión.</text><text x="500" y="454" class="tiny" text-anchor="middle">No existe binario Aula-16 generado ni ejecutado.</text></svg>