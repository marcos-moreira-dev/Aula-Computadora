" stroke-width="4" fill="none" marker-end="url(#arrowAmber)"/><path d="M697 315 L725 315" stroke="#275e72" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="506" y="450" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#223442" text-anchor="middle">CALL guarda retorno 0x6003; RET lo recupera en little-endian.</text><text x="506" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#223442" text-anchor="middle">Después de RET: PC=0x6003 y SP vuelve a 0x8000.</text><text x="506" y="533" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#576d79" text-anchor="middle">Cada tabla es un tramo contiguo; 6004–600F quedan fuera de esta vista.</text>
