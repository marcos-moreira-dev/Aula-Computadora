<text x="94" y="1052" fill="#526b78" font-size="23" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Dato de ejemplo: MEM[6000]=32, MEM[6001]=09; sólo modelo de anfitrión.</text>
