  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style>

<text x="37" y="41" class="label">Estado 0: la entrada conecta la base a GND</text>
<path class="wire" d="M120,111 V87 H293 M403,87 H662 V175 M662,257 V289 M662,363 V408 H120 V239"/>
