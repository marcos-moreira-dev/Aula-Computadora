<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><title>Una entrada, una variable, una salida</title><rect width="1000" height="500" fill="white"/>
<style>
  text {font-family: 'DejaVu Sans', Arial, sans-serif; fill:#1b2a38}
  .wire {stroke:#273746;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .node {fill:#273746}
  .block {fill:#f0f6fb;stroke:#273746;stroke-width:3}
  .label {font-size:22px;font-weight:bold}
  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style><text x="35" y="43" class="label">Una entrada, una variable, una salida</text><text x="35" y="76" class="small">El byte se guarda en RAM antes de transmitir; valores hipotéticos.</text><rect x="22" y="154" width="216" height="169" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="130.0" y="202" class="label" text-anchor="middle">CALL GETC</text><text x="130.0" y="248" class="small" text-anchor="middle">35 04 FF</text><text x="130" y="293" class="tiny" text-anchor="middle">PC 6000</text><path d="M238,240 L268,240" fill="none" stroke="#244d68" stroke-width="4"/><path d="M268,240 L251.0,249.0 L251.0,231.0 Z" fill="#244d68"/><rect x="268" y="154" width="216" height="169" rx="14" fill="#f9eedc" stroke="#36556b" stroke-width="2.5"/><text x="376.0" y="202" class="label" text-anchor="middle">ST 6F00</text><text x="376.0" y="248" class="small" text-anchor="middle">13 00 00 6F</text><text x="376" y="293" class="tiny" text-anchor="middle">PC 6003</text><path d="M484,240 L514,240" fill="none" stroke="#244d68" stroke-width="4"/><path d="M514,240 L497.0,249.0 L497.0,231.0 Z" fill="#244d68"/><rect x="514" y="154" width="216" height="169" rx="14" fill="#e9f4e6" stroke="#36556b" stroke-width="2.5"/><text x="622.0" y="202" class="label" text-anchor="middle">CALL PUTC</text><text x="622.0" y="248" class="small" text-anchor="middle">35 00 FF</text><text x="622" y="293" class="tiny" text-anchor="middle">PC 6007</text><path d="M730,240 L760,240" fill="none" stroke="#244d68" stroke-width="4"/><path d="M760,240 L743.0,249.0 L743.0,231.0 Z" fill="#244d68"/><rect x="760" y="154" width="216" height="169" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="868.0" y="202" class="label" text-anchor="middle">RET</text><text x="868.0" y="248" class="small" text-anchor="middle">02</text><text x="868" y="293" class="tiny" text-anchor="middle">PC 600A</text><rect x="256" y="372" width="486" height="79" rx="14" fill="#eef7ef" stroke="#36556b" stroke-width="2.5"/><text x="499.0" y="420" class="label" text-anchor="middle">RAM[6F00] = 42</text><text x="500" y="470" class="tiny" text-anchor="middle">Ejemplo: GETC recibe B (0x42), ST guarda, PUTC transmite.</text></svg>