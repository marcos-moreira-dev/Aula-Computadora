<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180">
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="65" y="78" fill="#18344a" font-size="42" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Decidir el próximo PC mediante puertas NAND</text>
<text x="65" y="128" fill="#4c6373" font-size="27" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Selector de salto JNZ · una de las 16 celdas de datos</text>
<rect x="65" y="175" width="1630" height="310" rx="18" fill="#eaf3f8"/>
<text x="100" y="222" fill="#18344a" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Control compartido por los 16 bits</text>
<rect x="280" y="284" width="182" height="124" rx="11" fill="#fff9e9" stroke="#ba8744" stroke-width="3"/>
<text x="371" y="363" fill="#5f4a28" font-size="51" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">&amp;</text>
<circle cx="473" cy="346" r="11" fill="#fcfdfd" stroke="#ba8744" stroke-width="3"/>
<text x="368" y="268" fill="#18344a" font-size="24" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">NZ</text>
<line x1="208" y1="324" x2="280" y2="324" stroke="#426179" stroke-width="4"/>
<text x="202" y="314" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">Z</text>
<line x1="208" y1="372" x2="280" y2="372" stroke="#426179" stroke-width="4"/>
<text x="202" y="362" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">Z</text>
<rect x="800" y="284" width="182" height="124" rx="11" fill="#fff9e9" stroke="#ba8744" stroke-width="3"/>
<text x="891" y="363" fill="#5f4a28" font-size="51" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">&amp;</text>
<circle cx="993" cy="346" r="11" fill="#fcfdfd" stroke="#ba8744" stroke-width="3"/>
<text x="888" y="268" fill="#18344a" font-size="24" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">TAKE_N</text>
<line x1="728" y1="324" x2="800" y2="324" stroke="#426179" stroke-width="4"/>
<text x="722" y="314" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">JNZ</text>
<line x1="728" y1="372" x2="800" y2="372" stroke="#426179" stroke-width="4"/>
<text x="722" y="362" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">NZ</text>
<rect x="1320" y="284" width="182" height="124" rx="11" fill="#fff9e9" stroke="#ba8744" stroke-width="3"/>
<text x="1411" y="363" fill="#5f4a28" font-size="51" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">&amp;</text>
<circle cx="1513" cy="346" r="11" fill="#fcfdfd" stroke="#ba8744" stroke-width="3"/>
<text x="1408" y="268" fill="#18344a" font-size="24" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">TAKE</text>
<line x1="1248" y1="324" x2="1320" y2="324" stroke="#426179" stroke-width="4"/>
<text x="1242" y="314" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">TAKE_N</text>
<line x1="1248" y1="372" x2="1320" y2="372" stroke="#426179" stroke-width="4"/>
<text x="1242" y="362" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">TAKE_N</text>
<text x="120" y="463" fill="#18344a" font-size="26" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Z=0 y JNZ=1 → TAKE=1; cualquier otro caso → TAKE=0</text>
<rect x="65" y="512" width="1630" height="455" rx="18" fill="#f2f8f4"/>
<text x="100" y="557" fill="#18344a" font-size="27" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Una celda de selección, repetida 16 veces (i = 0…15)</text>
<rect x="300" y="627" width="182" height="124" rx="11" fill="#fff9e9" stroke="#ba8744" stroke-width="3"/>
<text x="391" y="706" fill="#5f4a28" font-size="51" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">&amp;</text>
<circle cx="493" cy="689" r="11" fill="#fcfdfd" stroke="#ba8744" stroke-width="3"/>
<text x="388" y="611" fill="#18344a" font-size="24" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">Ai</text>
<line x1="228" y1="667" x2="300" y2="667" stroke="#426179" stroke-width="4"/>
<text x="222" y="657" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">SEQ[i]</text>
<line x1="228" y1="715" x2="300" y2="715" stroke="#426179" stroke-width="4"/>
<text x="222" y="705" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">TAKE_N</text>
<rect x="300" y="797" width="182" height="124" rx="11" fill="#fff9e9" stroke="#ba8744" stroke-width="3"/>
<text x="391" y="876" fill="#5f4a28" font-size="51" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">&amp;</text>
<circle cx="493" cy="859" r="11" fill="#fcfdfd" stroke="#ba8744" stroke-width="3"/>
<text x="388" y="781" fill="#18344a" font-size="24" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">Bi</text>
<line x1="228" y1="837" x2="300" y2="837" stroke="#426179" stroke-width="4"/>
<text x="222" y="827" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">TARGET[i]</text>
<line x1="228" y1="885" x2="300" y2="885" stroke="#426179" stroke-width="4"/>
<text x="222" y="875" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">TAKE</text>
<rect x="1180" y="713" width="182" height="124" rx="11" fill="#fff9e9" stroke="#ba8744" stroke-width="3"/>
<text x="1271" y="792" fill="#5f4a28" font-size="51" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">&amp;</text>
<circle cx="1373" cy="775" r="11" fill="#fcfdfd" stroke="#ba8744" stroke-width="3"/>
<text x="1268" y="697" fill="#18344a" font-size="24" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle">Di</text>
<line x1="1108" y1="753" x2="1180" y2="753" stroke="#426179" stroke-width="4"/>
<text x="1102" y="743" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">A_i</text>
<line x1="1108" y1="801" x2="1180" y2="801" stroke="#426179" stroke-width="4"/>
<text x="1102" y="791" fill="#426179" font-size="21" font-family="DejaVu Sans" font-weight="normal" text-anchor="end">B_i</text>
<path d="M504 689 H930 V753 H1108" fill="none" stroke="#326f85" stroke-width="4"/>
<path d="M504 859 H984 V801 H1108" fill="none" stroke="#326f85" stroke-width="4"/>
<text x="598" y="674" fill="#326f85" font-size="22" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">A_i</text>
<text x="598" y="843" fill="#326f85" font-size="22" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">B_i</text>
<path d="M1384 775 H1580" stroke="#326f85" stroke-width="5"/>
<text x="1604" y="768" fill="#326f85" font-size="23" font-family="DejaVu Sans" font-weight="bold" text-anchor="end">D[i]</text>
<text x="82" y="1036" fill="#18344a" font-size="26" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Las etiquetas TAKE y TAKE_N conectan redes con el mismo nombre.</text>
<text x="82" y="1080" fill="#18344a" font-size="26" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">La burbuja en cada salida indica inversión: todas las puertas son NAND.</text>
<text x="82" y="1132" fill="#516677" font-size="25" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">D[i] es la entrada candidata del PC; todavía falta el registro, LOAD y el reloj.</text>
</svg>