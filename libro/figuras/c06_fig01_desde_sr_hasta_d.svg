<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><title>Latch D desde NAND y latch SR</title><rect width="1000" height="500" fill="white"/>
<style>
  text {font-family: 'DejaVu Sans', Arial, sans-serif; fill:#1b2a38}
  .wire {stroke:#273746;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .node {fill:#273746}
  .block {fill:#f0f6fb;stroke:#273746;stroke-width:3}
  .label {font-size:22px;font-weight:bold}
  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style>
<text x="43" y="47" class="label">De una entrada D a un latch con memoria</text>
<text x="43" y="82" class="small">LE = 0 genera HOLD; LE = 1 selecciona SET o RESET mediante D.</text>
<rect x="386" y="122" width="163" height="96" rx="12" fill="#e6f3fa" stroke="#28465b" stroke-width="3"/><text x="467.5" y="177.0" text-anchor="middle" class="label">NAND</text><rect x="386" y="307" width="163" height="96" rx="12" fill="#e6f3fa" stroke="#28465b" stroke-width="3"/><text x="467.5" y="362.0" text-anchor="middle" class="label">NAND</text><rect x="235" y="310" width="90" height="80" rx="12" fill="#f2eaf6" stroke="#28465b" stroke-width="3"/><text x="280.0" y="357.0" text-anchor="middle" class="label">NOT</text><rect x="704" y="211" width="170" height="123" rx="12" fill="#e3f2e8" stroke="#28465b" stroke-width="3"/><text x="789.0" y="279.5" text-anchor="middle" class="label">SR NAND</text>
<text x="73" y="146" class="label accent">D</text>
<path class="wire" d="M111,142 H386"/>
<path class="wire" d="M166,142 V349 H235"/>
<circle cx="166" cy="142" r="5" class="node"/>
<path class="wire" d="M325,349 H386"/>
<text x="255" y="408" class="tiny">D invertida</text>
<text x="60" y="450" class="label accent">LE</text>
<path class="wire" d="M110,445 H360 V203 H386"/>
<path class="wire" d="M360,385 H386"/>
<circle cx="360" cy="385" r="5" class="node"/>
<!-- Hueco en la vertical LE: el cable de NOT D cruza sin conectarse. -->
<path d="M360,340 V358" stroke="white" stroke-width="11"/>
<path class="wire" d="M325,349 H386"/>
<path class="wire" d="M549,169 H635 V242 H704"/>
<path class="wire" d="M549,351 H635 V302 H704"/>
<text x="579" y="152" class="small accent">S_n</text>
<text x="579" y="374" class="small accent">R_n</text>
<path class="wire" d="M874,269 H960"/>
<text x="917" y="250" class="label accent">Q</text>
<text x="788" y="365" text-anchor="middle" class="tiny">Conserva el bit</text>
<text x="500" y="467" text-anchor="middle" class="tiny">Esquema funcional ideal, no patillaje ni diagrama de montaje.</text>
</svg>