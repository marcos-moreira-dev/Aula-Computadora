<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560"
      viewBox="0 0 1000 560" role="img">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M1 1 L9 5 L1 9" fill="none" stroke="#275e72" stroke-width="2.4"/>
      </marker>
      <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M1 1 L9 5 L1 9" fill="none" stroke="#a95d28" stroke-width="2.4"/>
      </marker>
    </defs>
    <rect width="1000" height="560" fill="#fbfaf7"/>
    <rect width="1000" height="9" fill="#275e72"/>
    <text x="38" y="61" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="bold" fill="#223442" text-anchor="start">Los dos buses no transportan lo mismo</text>
    <text x="39" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#536c7a" text-anchor="start">El de direcciones indica dónde; el de datos transporta el valor.</text>
    <rect x="40" y="157" width="225" height="292" rx="9" fill="#deecf4" stroke="#8ba8b5" stroke-width="1.6"/><rect x="741" y="157" width="219" height="292" rx="9" fill="#e4f2e1" stroke="#8ba8b5" stroke-width="1.6"/><text x="152" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="bold" fill="#223442" text-anchor="middle">CPU Aula-8</text><text x="848" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold" fill="#223442" text-anchor="middle">RAM / ROM</text><text x="152" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#223442" text-anchor="middle">MAR (16 bits)</text><text x="152" y="331" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#223442" text-anchor="middle">MDR (8 bits)</text><text x="848" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#223442" text-anchor="middle">A15 … A0</text><text x="848" y="331" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#223442" text-anchor="middle">D7 … D0</text><text x="152" y="398" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#223442" text-anchor="middle">Control RD/WR</text><text x="848" y="398" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#223442" text-anchor="middle">CE / OE / WE</text><path d="M268 242 L733 242" stroke="#275e72" stroke-width="8" fill="none" marker-end="url(#arrow)"/><text x="502" y="230" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" fill="#223442" text-anchor="middle">DIRECCIONES 16 bits</text><path d="M270 310 L730 310" stroke="#275e72" stroke-width="8" fill="none"/><path d="M270 340 L730 340" stroke="#275e72" stroke-width="8" fill="none"/><path d="M707 340 L736 340" stroke="#275e72" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M294 310 L265 310" stroke="#275e72" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="502" y="299" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#223442" text-anchor="middle">DATOS 8 bits, sentido variable</text><path d="M267 388 L733 388" stroke="#275e72" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="502" y="376" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#223442" text-anchor="middle">LECTURA O ESCRITURA, nunca a la vez</text><text x="500" y="502" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#566b77" text-anchor="middle">El diagrama describe un contrato de señales; aún faltan chips, pines y timing.</text>
    </svg>