</style><text x="35" y="43" class="label">RUN y PUTC: hay dos niveles de retorno</text><text x="35" y="76" class="small">HALT no equivale a RET ni provoca un prompt por sí solo.</text><rect x="30" y="166" width="221" height="192" rx="14" fill="#e8f1fa" stroke="#36556b" stroke-width="2.5"/><rect x="271" y="166" width="221" height="192" rx="14" fill="#f8efdc" stroke="#36556b" stroke-width="2.5"/><rect x="511" y="166" width="221" height="192" rx="14" fill="#e9f5e8" stroke="#36556b" stroke-width="2.5"/><rect x="751" y="166" width="221" height="192" rx="14" fill="#e8f1fa" stroke="#36556b" stroke-width="2.5"/><text x="140" y="211" class="label" text-anchor="middle">MONITOR</text><text x="140" y="275" class="small" text-anchor="middle">CALL 6000</text><text x="381" y="211" class="label" text-anchor="middle">PROGRAMA</text><text x="381" y="271" class="small" text-anchor="middle">CALL FF00</text><text x="622" y="211" class="label" text-anchor="middle">SERVICIO ROM</text><text x="622" y="275" class="small" text-anchor="middle">RET → 6006</text><text x="862" y="211" class="label" text-anchor="middle">PROGRAMA</text><text x="862" y="271" class="small" text-anchor="middle">RET → monitor</text><path class="wire" d="M251,258 H271 M492,258 H511 M732,258 H751"/><text x="500" y="426" class="small" text-anchor="middle">Si el programa termina en HALT, no retorna al monitor.</text></svg>