</style><text x="35" y="43" class="label">Registros de un controlador de bloques candidato</text><text x="35" y="76" class="small">C010–C01F: ocho registros de 8 bits y direcciones impares reservadas.</text><rect x="36" y="126" width="445" height="71" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="111" y="171" class="label" text-anchor="middle">C010</text><text x="287" y="170" class="label" text-anchor="middle">COMMAND</text><rect x="528" y="126" width="445" height="71" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="603" y="171" class="label" text-anchor="middle">C012</text><text x="779" y="170" class="label" text-anchor="middle">STATUS</text><rect x="36" y="212" width="445" height="71" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="111" y="257" class="label" text-anchor="middle">C014</text><text x="287" y="256" class="label" text-anchor="middle">BLOCK_LO</text><rect x="528" y="212" width="445" height="71" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="603" y="257" class="label" text-anchor="middle">C016</text><text x="779" y="256" class="label" text-anchor="middle">BLOCK_HI</text><rect x="36" y="298" width="445" height="71" rx="14" fill="#f9eedc" stroke="#36556b" stroke-width="2.5"/><text x="111" y="343" class="label" text-anchor="middle">C018</text><text x="287" y="342" class="label" text-anchor="middle">DATA</text><rect x="528" y="298" width="445" height="71" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="603" y="343" class="label" text-anchor="middle">C01A</text><text x="779" y="342" class="label" text-anchor="middle">ERROR</text><rect x="36" y="384" width="445" height="71" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="111" y="429" class="label" text-anchor="middle">C01C</text><text x="287" y="428" class="label" text-anchor="middle">COUNT_LO</text><rect x="528" y="384" width="445" height="71" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="603" y="429" class="label" text-anchor="middle">C01E</text><text x="779" y="428" class="label" text-anchor="middle">COUNT_HI</text><text x="500" y="487" class="tiny" text-anchor="middle">Solo direcciones PARES; cada registro representa un byte.</text></svg>