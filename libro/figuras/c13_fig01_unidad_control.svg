<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><title>Dos recorridos: programa y microcontrol</title><rect width="1000" height="500" fill="white"/>
<style>
  text {font-family: 'DejaVu Sans', Arial, sans-serif; fill:#1b2a38}
  .wire {stroke:#273746;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .node {fill:#273746}
  .block {fill:#f0f6fb;stroke:#273746;stroke-width:3}
  .label {font-size:22px;font-weight:bold}
  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style><text x="35" y="43" class="label">Dos recorridos: programa y microcontrol</text><text x="35" y="76" class="small">PC identifica bytes de programa; microPC selecciona acciones internas.</text><rect x="54" y="146" width="193" height="103" rx="14" fill="#e7f3fa" stroke="#36556b" stroke-width="2.5"/><rect x="300" y="146" width="245" height="103" rx="14" fill="#e7f3fa" stroke="#36556b" stroke-width="2.5"/><rect x="598" y="146" width="334" height="103" rx="14" fill="#e7f3fa" stroke="#36556b" stroke-width="2.5"/><text x="150" y="185" class="label" text-anchor="middle">PC · 16 bits</text><text x="150" y="220" class="small" text-anchor="middle">dirección programa</text><text x="422" y="185" class="label" text-anchor="middle">RAM / ROM</text><text x="422" y="220" class="small" text-anchor="middle">bytes de instrucciones</text><text x="765" y="185" class="label" text-anchor="middle">IR · opcode</text><text x="765" y="220" class="small" text-anchor="middle">selección de ruta</text><path class="wire" d="M247,194 H300 M545,194 H598"/><rect x="52" y="314" width="183" height="105" rx="14" fill="#f9f0d8" stroke="#36556b" stroke-width="2.5"/><rect x="285" y="314" width="255" height="105" rx="14" fill="#f9f0d8" stroke="#36556b" stroke-width="2.5"/><rect x="592" y="314" width="339" height="105" rx="14" fill="#eaf4eb" stroke="#36556b" stroke-width="2.5"/><text x="143" y="358" class="label" text-anchor="middle">microPC</text><text x="143" y="389" class="small" text-anchor="middle">estado interno</text><text x="413" y="358" class="label" text-anchor="middle">ROM de control</text><text x="413" y="389" class="small" text-anchor="middle">sin tamaño fijado</text><text x="763" y="355" class="label" text-anchor="middle">Señales para datapath</text><text x="763" y="390" class="small" text-anchor="middle">cargas · buses · RD/WR</text><path class="wire" d="M235,370 H285 M540,370 H592"/><path class="wire" d="M765,249 V275 H143 V314"/><text x="519" y="303" class="tiny" text-anchor="middle">despacho y condiciones</text><text x="495" y="470" class="small" text-anchor="middle">ROM de control y ROM de firmware son memorias distintas.</text></svg>