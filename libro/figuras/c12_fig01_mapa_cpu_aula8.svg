</style><text x="35" y="43" class="label">Aula-8: bloques y dos anchos diferentes</text><text x="35" y="76" class="small">Dirección externa de 16 bits; dato externo e interno de 8 bits. Ninguna ruta está siempre activa.</text><rect x="39" y="128" width="219" height="260" rx="14" fill="#f1f6fb" stroke="#36556b" stroke-width="2.5"/><text x="148" y="161" class="label" text-anchor="middle">Registros</text><text x="148" y="202" class="small" text-anchor="middle">R0  R1  R2  R3</text><text x="148" y="241" class="small" text-anchor="middle">4 x 8 bits</text><text x="148" y="290" class="label" text-anchor="middle">PC  SP  X</text><text x="148" y="327" class="small" text-anchor="middle">3 x 16 bits</text><rect x="330" y="127" width="215" height="119" rx="14" fill="#e9f3e8" stroke="#36556b" stroke-width="2.5"/><text x="438" y="166" class="label" text-anchor="middle">ALU8 + FLAGS</text><text x="438" y="210" class="small" text-anchor="middle">cálculo de datos</text><rect x="330" y="286" width="215" height="101" rx="14" fill="#f9f0d8" stroke="#36556b" stroke-width="2.5"/><text x="438" y="325" class="label" text-anchor="middle">Bus interno</text><text x="438" y="361" class="small" text-anchor="middle">8 bits</text><rect x="623" y="128" width="141" height="120" rx="14" fill="#e7f5fa" stroke="#36556b" stroke-width="2.5"/><text x="694" y="170" class="label" text-anchor="middle">MAR</text><text x="694" y="205" class="small" text-anchor="middle">16 bits</text><rect x="623" y="286" width="141" height="101" rx="14" fill="#e7f5fa" stroke="#36556b" stroke-width="2.5"/><text x="694" y="329" class="label" text-anchor="middle">MDR</text><text x="694" y="361" class="small" text-anchor="middle">8 bits</text><rect x="831" y="172" width="137" height="171" rx="14" fill="#f4f7fb" stroke="#36556b" stroke-width="2.5"/><text x="899" y="207" class="label" text-anchor="middle">RAM</text><text x="899" y="245" class="label" text-anchor="middle">ROM</text><text x="899" y="283" class="label" text-anchor="middle">E/S</text><path class="wire" d="M258,189 H330 M258,328 H330 M545,333 H623"/><path class="wire" d="M545,188 H585 V335 H623"/><path class="wire" d="M764,187 H831 M764,334 H831"/><text x="796" y="159" class="tiny" text-anchor="middle">A0..A15</text><text x="796" y="367" class="tiny" text-anchor="middle">D0..D7</text><text x="505" y="454" class="small" text-anchor="middle">Control: selecciona fuentes, destinos, ALU, lectura y escritura.</text><text x="505" y="480" class="tiny" text-anchor="middle">El esquema representa capacidades, no señales de reloj ni cableado físico.</text></svg>