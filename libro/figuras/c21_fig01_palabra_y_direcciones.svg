</style><text x="35" y="43" class="label">El dato se ensancha; el espacio direccionable no</text><text x="35" y="76" class="small">No confundir ancho de bus de datos y ancho de direcciones.</text><rect x="38" y="160" width="418" height="221" rx="14" fill="#e7f1fb" stroke="#36556b" stroke-width="2.5"/><text x="247.0" y="208" class="label" text-anchor="middle">AULA-8</text><text x="247.0" y="254" class="small" text-anchor="middle">R0 = 8 bits  |  ALU = 8 bits</text><rect x="544" y="160" width="418" height="221" rx="14" fill="#e9f4e6" stroke="#36556b" stroke-width="2.5"/><text x="753.0" y="208" class="label" text-anchor="middle">AULA-16</text><text x="753.0" y="254" class="small" text-anchor="middle">R0 = 16 bits  |  ALU = 16 bits</text><text x="245" y="331" class="small" text-anchor="middle">Bus externo: 8 bits</text><text x="756" y="331" class="small" text-anchor="middle">Bus externo: 16 bits</text><text x="500" y="425" class="label" text-anchor="middle">LAS DOS: 16 bits de dirección → 65536 direcciones de bytes.</text></svg>