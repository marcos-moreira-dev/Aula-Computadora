small" text-anchor="middle">6007</text><text x="922" y="248" class="label" text-anchor="middle">01</text><path class="wire" d="M36,318 V333 H369 V318 M394,318 V333 H847 V318 M873,318 V333 H968 V318"/><text x="198" y="363" class="label" text-anchor="middle">LDI: 3 bytes</text><text x="622" y="363" class="label" text-anchor="middle">ST: 4 bytes</text><text x="920" y="363" class="small" text-anchor="middle">HALT</text><text x="510" y="420" class="small" text-anchor="middle">RAM[6F00] es el DESTINO de ST, fuera de estas ocho posiciones.</text><text x="510" y="465" class="small" text-anchor="middle">Azul: opcode   ·   Verde: selector   ·   Crema: dato o dirección.</text></svg>