<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><title>Mapa funcional, no lista de chips instalados</title><rect width="1000" height="500" fill="white"/>
<style>
  text {font-family: 'DejaVu Sans', Arial, sans-serif; fill:#1b2a38}
  .wire {stroke:#273746;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .node {fill:#273746}
  .block {fill:#f0f6fb;stroke:#273746;stroke-width:3}
  .label {font-size:22px;font-weight:bold}
  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style><text x="35" y="43" class="label">Mapa funcional, no lista de chips instalados</text><text x="35" y="76" class="small">El bus tiene 16 bits de dirección; 64 KiB direccionables no son 64 KiB de RAM.</text><rect x="95" y="120" width="810" height="71" rx="14" fill="#e4f2e6" stroke="#36556b" stroke-width="2.5"/><text x="252" y="163" class="label" text-anchor="middle">E000–FFFF</text><text x="648" y="163" class="small" text-anchor="middle">EEPROM 8 KiB</text><rect x="95" y="202" width="810" height="71" rx="14" fill="#fff0dc" stroke="#36556b" stroke-width="2.5"/><text x="252" y="245" class="label" text-anchor="middle">C000–DFFF</text><text x="648" y="245" class="small" text-anchor="middle">E/S y zonas por definir</text><rect x="95" y="284" width="810" height="71" rx="14" fill="#f6f2ec" stroke="#36556b" stroke-width="2.5"/><text x="252" y="327" class="label" text-anchor="middle">8000–BFFF</text><text x="648" y="327" class="small" text-anchor="middle">Sin RAM inicial asignada</text><rect x="95" y="366" width="810" height="71" rx="14" fill="#e7f2fa" stroke="#36556b" stroke-width="2.5"/><text x="252" y="409" class="label" text-anchor="middle">0000–7FFF</text><text x="648" y="409" class="small" text-anchor="middle">RAM 32 KiB</text><text x="500" y="472" class="small" text-anchor="middle">RAM[6000–6FFF] es parte de la RAM; FFFC/FFFD está en ROM.</text></svg>