<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><title>Carga y retención por multiplexor</title><rect width="1000" height="500" fill="white"/>
<style>
  text {font-family: 'DejaVu Sans', Arial, sans-serif; fill:#1b2a38}
  .wire {stroke:#273746;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .node {fill:#273746}
  .block {fill:#f0f6fb;stroke:#273746;stroke-width:3}
  .label {font-size:22px;font-weight:bold}
  .small {font-size:17px}
  .tiny {font-size:15px}
  .accent {fill:#096b91}
  .light {fill:#fbe2aa;stroke:#ad7200;stroke-width:3}
  .red {stroke:#b64a30;fill:none;stroke-width:3}
</style>
<text x="40" y="47" class="label">Una posición del registro: elegir cargar o conservar</text>
<text x="40" y="84" class="small">El multiplexor selecciona un dato antes de que llegue el próximo flanco.</text>
<rect x="342" y="207" width="154" height="130" rx="12" fill="#e6f3fa" stroke="#28465b" stroke-width="3"/><text x="419.0" y="279.0" text-anchor="middle" class="label">MUX 2:1</text><rect x="625" y="197" width="148" height="139" rx="12" fill="#e1f3e8" stroke="#28465b" stroke-width="3"/><text x="699.0" y="273.5" text-anchor="middle" class="label">FF D</text>
<text x="55" y="228" class="label accent">IN_i</text>
<path class="wire" d="M111,225 H342"/>
<path class="wire" d="M496,266 H625"/>
<text x="534" y="248" class="small accent">D_i</text>
<path class="wire" d="M773,266 H921"/>
<text x="862" y="248" class="label accent">Q_i</text>
<path class="wire" d="M861,266 V393 H238 V302 H342"/>
<circle class="node" cx="861" cy="266" r="5"/>
<text x="110" y="390" class="small">Realimentación</text>
<path class="wire" d="M420,129 V207"/>
<text x="385" y="119" class="label accent">LOAD</text>
<path class="wire" d="M701,336 V422"/>
<text x="660" y="447" class="label accent">CLK ↑</text>
<text x="500" y="482" class="tiny" text-anchor="middle">LOAD = 0 selecciona Q_i; LOAD = 1 selecciona IN_i.</text>
