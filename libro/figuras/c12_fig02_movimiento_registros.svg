</style><text x="35" y="43" class="label">Una copia controlada: R1 hacia R0</text><text x="35" y="76" class="small">Elegir la fuente no basta: también debe habilitarse la captura del registro destino.</text><rect x="48" y="174" width="233" height="144" rx="14" fill="#e9f4ea" stroke="#36556b" stroke-width="2.5"/><rect x="383" y="174" width="218" height="144" rx="14" fill="#f9f0d8" stroke="#36556b" stroke-width="2.5"/><rect x="714" y="174" width="240" height="144" rx="14" fill="#e8f2fa" stroke="#36556b" stroke-width="2.5"/><text x="164" y="216" class="label" text-anchor="middle">R1 · fuente</text><text x="164" y="262" class="label" text-anchor="middle">00111100</text><text x="492" y="217" class="label" text-anchor="middle">Bus interno</text><text x="492" y="263" class="label" text-anchor="middle">00111100</text><text x="834" y="216" class="label" text-anchor="middle">R0 · destino</text><text x="834" y="263" class="label" text-anchor="middle">00111100</text><path class="wire" d="M281,247 H383 M601,247 H714"/><path class="wire" d="M834,110 V174 M164,368 V318"/><text x="842" y="113" class="small">LOAD R0</text><text x="164" y="392" class="small" text-anchor="middle">SEL=R1</text><text x="502" y="436" class="small" text-anchor="middle">Antes: R0=00000000. Después: R0=00111100.</text><text x="502" y="475" class="small" text-anchor="middle">R1 no se borra: no se activó ninguna escritura en R1.</text></svg>