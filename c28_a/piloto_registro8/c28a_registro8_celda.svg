<text x="825" y="251" text-anchor="middle" font-size="18" font-weight="normal" fill="#237c59">Q_i</text>
<polyline points="825,269 825,446 268,446 268,299 331,299" fill="none" stroke="#203444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="825" cy="269" r="5" fill="#203444"/>
<text x="538" y="431" text-anchor="middle" font-size="16" font-weight="normal" fill="#237c59">Realimentación: LOAD = 0 conserva Q_i</text>
<polygon points="929,223 929,315 1014,269" fill="#e6eff8" stroke="#276486" stroke-width="3" stroke-linejoin="round"/>
<text x="962" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#276486">3E</text>
<polyline points="975,152 975,227" fill="none" stroke="#276486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="975" cy="234" r="7" fill="#ffffff" stroke="#276486" stroke-width="2.5"/>
<text x="975" y="139" text-anchor="middle" font-size="18" font-weight="bold" fill="#276486">OE_n</text>
<polyline points="1014,269 1122,269" fill="none" stroke="#276486" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1122" y="242" text-anchor="end" font-size="20" font-weight="bold" fill="#276486">BUS_i</text>
<rect x="50" y="505" width="1100" height="109" rx="13" fill="#f4f7f8" stroke="#cbd9df" stroke-width="1"/>
<text x="80" y="540" text-anchor="start" font-size="19" font-weight="normal" fill="#203444">Al flanco ↑: LOAD=1 → Q_i toma IN_i; LOAD=0 → Q_i se conserva.</text>
<text x="80" y="572" text-anchor="start" font-size="19" font-weight="normal" fill="#203444">Entre flancos: Q_i no cambia. OE_n=0 conduce Q_i; OE_n=1 libera el bus (Z).</text>
<text x="49" y="657" text-anchor="start" font-size="16" font-weight="normal" fill="#506777">Modelo lógico; no especifica patas reales, retardo de propagación, voltaje ni estado al encender.</text>
