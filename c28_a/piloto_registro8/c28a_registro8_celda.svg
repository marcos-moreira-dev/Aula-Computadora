<text x="696" y="265" text-anchor="middle" font-size="27" font-weight="bold" fill="#203444">FF D</text>
<text x="696" y="297" text-anchor="middle" font-size="18" font-weight="normal" fill="#203444">1 bit</text>
<text x="611" y="284" text-anchor="start" font-size="17" font-weight="normal" fill="#203444">D</text>
<text x="776" y="284" text-anchor="end" font-size="17" font-weight="normal" fill="#203444">Q</text>
