<style>text{font-family:DejaVu Sans, sans-serif;fill:#203444} .cable{fill:none;stroke:#203444;stroke-width:3;stroke-linejoin:round;stroke-linecap:round} .señal{fill:none;stroke:#276486;stroke-width:3;stroke-linecap:round} .fin{font-size:14px;fill:#576a78} .base{font-size:19px;font-weight:600} .cab{font-size:30px;font-weight:700} .sub{font-size:17px;fill:#506777}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="56" text-anchor="start" font-size="30" font-weight="bold" fill="#203444">Una celda del registro: guardar no es conducir</text>
<text x="43" y="89" text-anchor="start" font-size="18" font-weight="normal" fill="#506777">El diseño de Aula-8 repite esta misma celda ocho veces.</text>
<polyline points="92,235 331,235" fill="none" stroke="#203444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="94" y="213" text-anchor="start" font-size="20" font-weight="bold" fill="#276486">IN_i</text>
<polygon points="331,205 473,229 473,307 331,326" fill="#f9e8c6" stroke="#203444" stroke-width="3" stroke-linejoin="round"/>
<text x="401" y="261" text-anchor="middle" font-size="22" font-weight="bold" fill="#203444">MUX</text>
<text x="401" y="287" text-anchor="middle" font-size="18" font-weight="normal" fill="#203444">2:1</text>
<polyline points="399,153 399,216" fill="none" stroke="#276486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="399" y="139" text-anchor="middle" font-size="18" font-weight="bold" fill="#276486">LOAD</text>
<text x="344" y="226" text-anchor="start" font-size="15" font-weight="normal" fill="#203444">1</text>
<text x="344" y="306" text-anchor="start" font-size="15" font-weight="normal" fill="#203444">0</text>
<polyline points="473,269 600,269" fill="none" stroke="#203444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="253" text-anchor="middle" font-size="17" font-weight="normal" fill="#276486">D_i</text>
