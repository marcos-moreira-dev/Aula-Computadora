xt-anchor="end" x="1567" y="556">1</text><text fill="#b27a26" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" x="1290" y="597">Resultado: no superado</text><text fill="#ba4c4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" x="20" y="682">PROBLEMA · PR-004</text><text fill="#243648" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="20" y="713">Para A=1 y B=1 se observó 1, pero NAND2 debe producir 0.</text><text fill="#677a8c" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="20" y="745">Revisa el circuito y vuelve a probar. No hay evidencia suficiente para señalar una pieza.</text><line stroke="#d7e0e9" stroke-linecap="round" stroke-width="1.5" x1="0" x2="1600" y1="773" y2="773" /><text fill="#27649b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" x="20" y="801">Vectores: 00→1   ✓     01→1   ✓     10→1   ✓     11→1   ✕  (esperado 0)</text><text fill="#43586c" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="22" y="883">Aula-8 · Probar módulo</text><text fill="#43586c" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="682" y="883">CPU: detenida</text><text fill="#317c61" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="978" y="883">Pruebas: 3 de 4</text><text fill="#43586c" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="1325" y="883">Zoom: 100 %</text><g id="toolbar_icons_v2"><rect x="0" y="80" width="1600" height="55" fill="#f8fafc" /><rect x="20" y="90" width="96" height="34" rx="4" fill="#27649b" stroke="#27649b" stroke-width="1" /><g transform="translate(29,98) scale(0.70)"><path d="M5 